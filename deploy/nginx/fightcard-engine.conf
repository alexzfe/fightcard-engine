# The public /v1/ API (docs/API.md, docs/CONTRACT.md) for nginxinc/nginx-unprivileged, as
# /etc/nginx/conf.d/default.conf. Serves the tree `fightcard publish --out /srv/fightcard` writes: `current` is a
# symlink to the live generation, swapped atomically, and nginx resolves it on every request (no open_file_cache).
# Only the documented resource shapes are mapped; everything else is a JSON 404.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;
    etag on;

    # Replaces the http-level mime.types: these are the only types published.
    types {
        application/json json;
        application/gzip gz;
        image/webp webp;
        image/png png;
        image/jpeg jpg jpeg;
        image/avif avif;
        image/gif gif;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/json;

    error_page 404 = @not_found;
    error_page 405 = @method_not_allowed;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The index and the snapshot change with every generation.
    location ~ ^/v1/(index\.json|snapshot\.tar\.gz)$ {
        alias /srv/fightcard/current/$1;
        add_header Cache-Control "public, max-age=60";
    }

    location ~ ^/v1/(images/[^/]+)$ {
        alias /srv/fightcard/current/$1;
        add_header Cache-Control "public, max-age=86400";
    }

    # fighters.json, schema.json, events/<id>.json
    location ~ ^/v1/((?:events/)?[^/]+\.json)$ {
        alias /srv/fightcard/current/$1;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }

    # Empty `types`: an error body is JSON whatever the requested extension.
    location @not_found {
        types { }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error": "not found"}\n';
    }

    location @method_not_allowed {
        types { }
        default_type application/json;
        add_header Allow "GET, HEAD" always;
        add_header Cache-Control "no-store" always;
        return 405 '{"error": "method not allowed"}\n';
    }
}
