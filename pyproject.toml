[project]
name = "fightcard"
version = "0.1.0"
description = "Data pipeline for ufc.xlobax.com: scrape ufcstats, fetch headshots, score finish tiers"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.4",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pydantic>=2.7",
    "rapidfuzz>=3",
    "lightgbm>=4",
    "pyarrow>=16",
    "pillow>=10",
    "pandas>=2.2",
]

[project.scripts]
fightcard = "fightcard.cli:main"
fightcard-service = "fightcard.service.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fightcard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live and not docker and not seed'"
markers = [
    "live: hits the network; run explicitly with -m live",
    "docker: starts a container; run explicitly with -m docker",
    "seed: reads the research repo's full ufcstats cache (skips when absent); run explicitly with -m seed",
]
